name: Build Unsigned IPA for AltStore

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Package iOS IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          echo "=== Selecting Xcode 16 ==="
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            echo "Found Xcode 16 at $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          else
            echo "Using default Xcode selection"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          echo "Installing XcodeGen via Homebrew..."
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode Project
        run: |
          echo "Generating .xcodeproj from project.yml..."
          xcodegen generate
          ls -la PixelBeauty.xcodeproj

      - name: Build Application Bundle (Unsigned for Sideloading)
        run: |
          echo "Compiling Release Build with xcodebuild..."
          set -o pipefail
          xcodebuild build \
            -project PixelBeauty.xcodeproj \
            -scheme PixelBeauty \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee xcodebuild.log || (echo "=== COMPILATION FAILED - COMPILER ERRORS ===" && grep -C 3 -E "error:|fatal error:" xcodebuild.log && exit 1)

      - name: Package IPA (AltStore / Sideloadly Compatible)
        run: |
          echo "Packaging application bundle into IPA format..."
          APP_PATH=$(find build/DerivedData -name "PixelBeauty.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: PixelBeauty.app not found!"
            find build/DerivedData -name "*.app"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr PixelBeauty.ipa Payload
          echo "=== IPA Generated Successfully ==="
          ls -lh PixelBeauty.ipa
          shasum -a 256 PixelBeauty.ipa
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelBeauty-Unsigned-IPA
          path: build/PixelBeauty.ipa
          if-no-files-found: error
          retention-days: 90
